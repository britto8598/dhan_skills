# Production stack for a DigitalOcean Droplet (or any Docker host).
#   docker compose up -d --build
# The terminal listens on 127.0.0.1:3000; host Nginx terminates TLS and proxies
# https:// and wss://…/feed to it (see deploy/nginx.conf).
services:
  terminal:
    build: .
    image: orderflow-terminal:latest
    container_name: orderflow-terminal
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - SIM_SPEED=${SIM_SPEED:-1}
    ports:
      - "127.0.0.1:3000:3000"
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
