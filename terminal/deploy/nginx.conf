# /etc/nginx/sites-available/orderflow-terminal
# Reverse proxy for the terminal on a DigitalOcean Droplet.
# 1. Replace terminal.example.com with your domain (DNS A record → droplet IP).
# 2. sudo ln -s /etc/nginx/sites-available/orderflow-terminal /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. sudo certbot --nginx -d terminal.example.com   (adds the TLS server block + auto-renew)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream orderflow_terminal {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name terminal.example.com;

    # certbot rewrites this block to redirect to https after issuing the certificate
    client_max_body_size 2m;

    # High-frequency market-data WebSocket (wss:// once TLS is on)
    location /feed {
        proxy_pass http://orderflow_terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        tcp_nodelay on;
    }

    location /_next/static/ {
        proxy_pass http://orderflow_terminal;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://orderflow_terminal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
